<html lang="en">
<head>

  <title>GOODNESS GRAPHIC | Professional Graphic Designer</title>

  <meta name="description" content="GOODNESS GRAPHIC - Professional graphic design services for businesses, brands and individuals.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080808;
      color: #ffffff;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(8, 8, 8, 0.95);
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
      backdrop-filter: blur(10px);
    }

    .nav {
      max-width: 1150px;
      margin: auto;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      color: #d4af37;
      letter-spacing: 1px;
    }

    .menu {
      display: flex;
      gap: 25px;
      list-style: none;
    }

    .menu a {
      font-size: 14px;
      font-weight: bold;
      transition: 0.3s;
    }

    .menu a:hover {
      color: #d4af37;
    }

    /* HERO */
    .hero {
      min-height: 100vh;
      padding: 150px 20px 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background:
        radial-gradient(circle at top, #25200d 0%, #080808 45%);
    }

    .hero-content {
      max-width: 850px;
    }

    .small-title {
      color: #d4af37;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .hero h1 {
      font-size: clamp(45px, 9vw, 90px);
      line-height: 1;
      margin-bottom: 25px;
      font-weight: 900;
    }

    .hero h1 span {
      color: #d4af37;
    }

    .hero p {
      max-width: 650px;
      margin: auto;
      color: #cccccc;
      font-size: 18px;
    }

    .buttons {
      margin-top: 35px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 14px 25px;
      border-radius: 30px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn-gold {
      background: #d4af37;
      color: #000;
    }

    .btn-gold:hover {
      transform: translateY(-4px);
      background: #f0cf63;
    }

    .btn-outline {
      border: 1px solid #d4af37;
      color: #d4af37;
    }

    .btn-outline:hover {
      background: #d4af37;
      color: #000;
    }

    /* GENERAL */
    section {
      padding: 90px 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 50px;
    }

    .section-title h2 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .section-title span {
      color: #d4af37;
    }

    .section-title p {
      color: #aaa;
    }

    /* ABOUT */
    .about {
      background: #0e0e0e;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: center;
    }

    .about-box {
      padding: 30px;
      border: 1px solid #252525;
      border-radius: 20px;
      background: #121212;
    }

    .about-box h3 {
      color: #d4af37;
      font-size: 28px;
      margin-bottom: 15px;
    }

    .about-box p {
      color: #bbbbbb;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .stat {
      background: #171717;
      padding: 25px;
      text-align: center;
      border-radius: 15px;
      border: 1px solid #292929;
    }

    .stat h3 {
      color: #d4af37;
      font-size: 32px;
    }

    /* SERVICES */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
